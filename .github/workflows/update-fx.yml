name: Update FX rates

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (UTC); GitHub may start runs a few minutes late
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-fx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install --quiet yfinance

      - name: Fetch rates
        run: python scripts/fx_update.py

      - name: Commit fx.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add fx.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update FX rates"
            git push
          fi
